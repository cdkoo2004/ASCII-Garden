button:not(.tool) {

const TOOLS = [
  {name:"Pink flower",art:FLOWER,color:"#e0568a"},
  {name:"Yellow flower",art:FLOWER,color:"#f2b62c"},
  {name:"Blue flower",art:FLOWER,color:"#6f7ff0"},
  {name:"Red flower",art:FLOWER,color:"#e8452c"},
  {name:"White flower",art:FLOWER,color:"#f6f6ee"},
  {name:"Pastel yellow flower",art:FLOWER,color:"#fff1a8"},
  {name:"Sage flower",art:FLOWER,color:"#7b8b81"},
  {name:"Pink bud",art:FLOWER2,color:"#e0568a",scale:0.85},
  {name:"Yellow bud",art:FLOWER2,color:"#f2b62c",scale:0.85},
  {name:"Blue bud",art:FLOWER2,color:"#6f7ff0",scale:0.85},
  {name:"Red bud",art:FLOWER2,color:"#e8452c",scale:0.85},
  {name:"White bud",art:FLOWER2,color:"#f6f6ee",scale:0.85},
  {name:"Pastel yellow bud",art:FLOWER2,color:"#fff1a8",scale:0.85},
  {name:"Sage bud",art:FLOWER2,color:"#7b8b81",scale:0.85},
  {name:"Pink bloom",art:FLOWER3,color:"#e0568a"},
  {name:"Yellow bloom",art:FLOWER3,color:"#f2b62c"},
  {name:"Blue bloom",art:FLOWER3,color:"#6f7ff0"},
  {name:"Red bloom",art:FLOWER3,color:"#e8452c"},
  {name:"White bloom",art:FLOWER3,color:"#f6f6ee"},
  {name:"Pastel yellow bloom",art:FLOWER3,color:"#fff1a8"},
  {name:"Sage bloom",art:FLOWER3,color:"#7b8b81"},
  {name:"Pink lily",art:FLOWER4,color:"#e0568a",scale:0.6},
  {name:"Yellow lily",art:FLOWER4,color:"#f2b62c",scale:0.6},
  {name:"Blue lily",art:FLOWER4,color:"#6f7ff0",scale:0.6},
  {name:"Red lily",art:FLOWER4,color:"#e8452c",scale:0.6},
  {name:"White lily",art:FLOWER4,color:"#f6f6ee",scale:0.6},
  {name:"Pastel yellow lily",art:FLOWER4,color:"#fff1a8",scale:0.6},
  {name:"Sage lily",art:FLOWER4,color:"#7b8b81",scale:0.6},
  {name:"Pink rose",art:FLOWER5,color:"#e0568a",scale:0.5},
  {name:"Yellow rose",art:FLOWER5,color:"#f2b62c",scale:0.5},
  {name:"Blue rose",art:FLOWER5,color:"#6f7ff0",scale:0.5},
  {name:"Red rose",art:FLOWER5,color:"#e8452c",scale:0.5},
  {name:"White rose",art:FLOWER5,color:"#f6f6ee",scale:0.5},
  {name:"Pastel yellow rose",art:FLOWER5,color:"#fff1a8",scale:0.5},
  {name:"Sage rose",art:FLOWER5,color:"#7b8b81",scale:0.5},
  {name:"Pink orchid",art:FLOWER6,color:"#e0568a",scale:0.5},
  {name:"Yellow orchid",art:FLOWER6,color:"#f2b62c",scale:0.5},
  {name:"Blue orchid",art:FLOWER6,color:"#6f7ff0",scale:0.5},
  {name:"Red orchid",art:FLOWER6,color:"#e8452c",scale:0.5},
  {name:"White orchid",art:FLOWER6,color:"#f6f6ee",scale:0.5},
  {name:"Pastel yellow orchid",art:FLOWER6,color:"#fff1a8",scale:0.5},
  {name:"Sage orchid",art:FLOWER6,color:"#7b8b81",scale:0.5},
];
const garden = document.getElementById("garden");
const ghost = document.getElementById("ghost");
const status = document.getElementById("status");
const bar = document.getElementById("bar");
const placed = []; // stack of placed elements, for undo
let current = TOOLS[0];
let erasing = false;

// Build the toolbar by creating and appending buttons
TOOLS.forEach((t, i) => {
  if (i && t.art !== TOOLS[i - 1].art) bar.appendChild(Object.assign(document.createElement("span"), {className: "sep"}));
  const b = document.createElement("button");
  b.className = "tool";
  // Show the actual ASCII art, scaled down to fit the button
  const sw = document.createElement("span");
  sw.className = "swatch";
  const art = document.createElement("span");
  art.textContent = t.art;
  art.style.setProperty("--c", t.color);
  const rows = t.art.split("\n");
  const cols = Math.max(...rows.map(r => r.length));
  const k = 42 / Math.max(cols * 6.02, rows.length * 10);
  art.style.transform = "translate(-50%,-50%) scale(" + k.toFixed(3) + ")";
  sw.appendChild(art);
  b.appendChild(sw);
  b.title = t.name;
  b.setAttribute("aria-label", t.name);
  b.setAttribute("aria-pressed", i === 0);
  b.addEventListener("click", () => select(t, b));
  bar.appendChild(b);
});
bar.appendChild(Object.assign(document.createElement("span"), {className: "sep"}));
const eraseBtn = addAction("Erase", () => {
  erasing = !erasing;
  eraseBtn.setAttribute("aria-pressed", erasing);
  garden.classList.toggle("erasing", erasing);
  ghost.style.display = "none";
  say(erasing ? "Erase mode: click a plant to remove it." : "Planting " + current.name.toLowerCase() + ".");
});
eraseBtn.setAttribute("aria-pressed", false);
addAction("Undo", undo);
addAction("Clear", () => { placed.splice(0).forEach(el => el.remove()); say("Garden cleared. Plant something new."); });

function addAction(label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.addEventListener("click", fn);
  bar.appendChild(b);
  return b;
}
function select(t, btn) {
  current = t;
  erasing = false;
  eraseBtn.setAttribute("aria-pressed", false);
  garden.classList.remove("erasing");
  bar.querySelectorAll(".tool").forEach(x => x.setAttribute("aria-pressed", x === btn));
  say("Planting " + t.name.toLowerCase() + ".");
}
function say(msg) { status.textContent = msg; }
function undo() { const el = placed.pop(); if (el) el.remove(); }

// Convert a mouse event into coordinates relative to the garden box
function localPoint(ev) {
  const r = garden.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width, h: r.height};
}
// Items lower in the garden are "closer", so they render bigger
function sizeFor(t, y, h) {
  const depth = 0.55 + (y / h) * 0.9;
  return +(5.5 * depth * (t.scale || 1)).toFixed(1);
}
function canPlace(t, p) { return true; }

function plantAt(t, p) {
  const el = document.createElement("div");
  el.className = "item" + (t.fly ? " fly" : "");
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  el.style.zIndex = Math.round(p.y);
  el.style.fontSize = (sizeFor(t, p.y, p.h) * (0.9 + Math.random() * 0.25)).toFixed(1) + "px";
  el.style.setProperty("--c", t.color);
  el.style.setProperty("--d", (2.5 + Math.random() * 3).toFixed(2) + "s");
  el.style.setProperty("--l", (-Math.random() * 3).toFixed(2) + "s");
  const s = document.createElement("span");
  s.textContent = t.art;
  el.appendChild(s);
  garden.appendChild(el);
  placed.push(el);
  el.addEventListener("click", ev => {
    if (!erasing) return;
    ev.stopPropagation();
    el.remove();
    const i = placed.indexOf(el);
    if (i > -1) placed.splice(i, 1);
  });
}

garden.addEventListener("click", ev => {
  if (erasing) return;
  const p = localPoint(ev);
  if (!canPlace(current, p)) { say("Flowers grow in the soil. Click lower down."); return; }
  plantAt(current, p);
  say(placed.length + (placed.length === 1 ? " flowers" : " flowers") + " in the garden. ");
});

// Ghost preview follows the pointer
garden.addEventListener("mousemove", ev => {
  if (erasing) return;
  const p = localPoint(ev);
  ghost.className = "item" + (current.fly ? " fly" : "");
  ghost.style.display = canPlace(current, p) ? "block" : "none";
  ghost.style.left = p.x + "px";
  ghost.style.top = p.y + "px";
  ghost.style.fontSize = sizeFor(current, p.y, p.h) + "px";
  ghost.firstChild.textContent = current.art;
  ghost.style.setProperty("--c", current.color);
});
garden.addEventListener("mouseleave", () => { ghost.style.display = "none"; });

document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); }
});
</script>
